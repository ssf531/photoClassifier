[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-intelligence-core"
version = "0.1.0"
description = "Local AI Photo Intelligence Platform - core service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pywebview>=5.1",
    "pydantic-settings>=2.4",
    "platformdirs>=4.2",
    "tomli-w>=1.0",
    "structlog>=24.1",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "sqlite-vec>=0.1.3",
    "packaging>=24.0",
    "xxhash>=3.4",
    "Pillow>=10.3",
    "rawpy>=0.19",
    "numpy>=1.26",
    "httpx>=0.27",
    "onnxruntime>=1.17",
    "tokenizers>=0.19",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10", "pytest>=8.2", "pytest-asyncio>=0.23", "import-linter>=2.0", "pre-commit>=3.7"]
# HEIC/HEIF is an optional component (ADR-0012): detected at startup, degrades
# to a placeholder thumbnail when absent rather than being a hard dependency.
heic = ["pillow-heif>=0.15"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*"]

[tool.setuptools.package-data]
core = ["py.typed", "config.toml.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "sqlite_vec"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pillow_heif"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "onnxruntime"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tokenizers"
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["core"]
contracts = [
    { name = "Core layering (api -> application/infrastructure -> domain)", type = "layers", layers = [
        "(core.api)",
        "(core.infrastructure) | (core.application)",
        "(core.domain)",
    ] },
]
