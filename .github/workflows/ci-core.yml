name: CI - core

on:
  pull_request:
    paths:
      - "src/core/**"
      - "tests/**"
      - "alembic/**"
      - "alembic.ini"
      - "tools/**"
      - "pyproject.toml"
      - ".github/workflows/ci-core.yml"

jobs:
  lint-type-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ExifTool
        run: choco install exiftool -y --no-progress
      - name: Install core (with dev extras)
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src tests alembic tools
      - name: Ruff format check
        run: ruff format --check src tests alembic tools
      - name: Mypy (strict)
        run: mypy --strict src/core tools
      - name: Import layering (import-linter)
        run: lint-imports
      - name: Pytest
        run: pytest
